{% extends "base.html" %}

{% block extra_css %}
<style>
    /* Полный сброс для всей страницы */
    html.rate-limit-page,
    body.rate-limit-page {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        height: 100% !important;
        width: 100% !important;
    }

    /* Канвас – фиксирован, без отступов и рамок */
    #networkCanvas {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        outline: none !important;
        display: block !important;
        z-index: 0;
        opacity: 0.5;
        pointer-events: none; /* чтобы мышь не мешала кликам по кнопкам */
    }

    /* Переопределяем main-content */
    html.rate-limit-page .main-content {
        margin-left: 0 !important;
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        min-height: 100vh !important;
        overflow: hidden !important;
    }

    /* Скрываем flash-сообщения */
    html.rate-limit-page .main-content .alert {
        display: none !important;
    }

    /* Контейнер с карточкой поверх канваса */
    .rate-limit-page {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background: transparent; /* фон не нужен, канвас сам */
    }

    .rate-limit-container {
        position: relative;
        z-index: 1;
        max-width: 500px;
        width: 100%;
        animation: fadeInUp 0.6s ease-out;
        padding: 0 1rem; /* маленький отступ для мобильных, но не мешает */
    }

    .rate-limit-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 1.5rem;
        padding: 3rem;
        box-shadow: var(--card-shadow);
        border: 1px solid var(--border-color);
        text-align: center;
    }

    [data-theme="dark"] .rate-limit-card {
        background: rgba(45, 45, 45, 0.95);
        border: 1px solid var(--border-color);
    }

    .rate-limit-icon {
        font-size: 4rem;
        color: var(--accent-color);
        margin-bottom: 1.5rem;
    }

    .rate-limit-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 1rem;
    }

    .rate-limit-message {
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
    }

    .rate-limit-timer {
        background: color-mix(in srgb, var(--accent-color) 10%, transparent);
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--accent-color);
    }

    .rate-limit-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 600;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: none;
        cursor: pointer;
        font-size: 1rem;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
        color: white;
        box-shadow: 0 4px 15px color-mix(in srgb, var(--accent-color) 30%, transparent);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px color-mix(in srgb, var(--accent-color) 40%, transparent);
    }

    .btn-outline {
        background: transparent;
        border: 2px solid var(--accent-color);
        color: var(--accent-color);
    }

    .btn-outline:hover {
        background: var(--accent-color);
        color: white;
        transform: translateY(-2px);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 576px) {
        .rate-limit-card {
            padding: 2rem 1.5rem;
        }

        .rate-limit-title {
            font-size: 1.5rem;
        }

        .rate-limit-actions {
            flex-direction: column;
        }

        .btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="rate-limit-page">
    <canvas id="networkCanvas"></canvas>

    <div class="rate-limit-container">
        <div class="rate-limit-card">
            <div class="rate-limit-icon">
                <i class="fas fa-clock"></i>
            </div>

            <h1 class="rate-limit-title">Слишком много запросов</h1>

            <p class="rate-limit-message">
                Вы отправили слишком много запросов. Пожалуйста, подождите несколько минут перед повторной попыткой.
            </p>

            <div class="rate-limit-timer">
                <i class="fas fa-hourglass-half me-2"></i>
                Повторите попытку через {{ retry_after }} секунд
            </div>

            <div class="rate-limit-actions">
                <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>На страницу входа
                </a>
                <button onclick="history.back()" class="btn btn-outline">
                    <i class="fas fa-arrow-left me-2"></i>Назад
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем исправленный скрипт -->
<script src="{{ url_for('static', filename='js/network-animation.js') }}"></script>
{% endblock %}
